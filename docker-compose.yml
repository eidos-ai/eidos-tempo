services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${TEMPO_DATA_DIR}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TEMPO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEMPO_COOKIE_SECURE: ${TEMPO_COOKIE_SECURE:-true}
      TEMPO_LOG_LEVEL: ${TEMPO_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${TEMPO_HTTP_PORT:-80}:80"
    depends_on:
      - backend

  backup:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["/scripts/backup-loop.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-UTC}
    volumes:
      - ${TEMPO_DATA_DIR}/backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
