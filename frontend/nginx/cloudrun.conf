# Cloud Run: the backend container shares this instance's localhost. Google's front end appends the
# caller's address as the last X-Forwarded-For entry, so that one is used for the login rate limit.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 8080;

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    set $backend_upstream http://127.0.0.1:8000;

    include /etc/nginx/tempo/app.conf;
}
